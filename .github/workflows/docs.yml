name: Docs

# Builds the user guide (docs/guide) with VitePress and publishes it to GitHub Pages at guide.orbisreader.com. See
# docs/design/docs-site.md.
#
# **The custom domain lives in the repository's Pages settings, not in a file.** With GitHub Actions as the Pages
# source, GitHub keeps the domain itself, so no `CNAME` file is built into the site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'docs/.vitepress/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer push waits rather than cancelling one half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# **Built without the deploy permissions, published by a job that runs nothing of the repository's.** Installing and
# building run dependency code; none of it should hold the token that can publish the site. So `build` reads only and
# hands the built site to `deploy`, which runs GitHub's own deploy action and nothing else.
jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.0'
          # setup-node turns on a dependency cache from `packageManager` unless told not to.
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      # No dependency cache in this workflow: one that publishes should not restore what another run saved.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish the built site
      id-token: write # prove to Pages that this run is the one deploying
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
